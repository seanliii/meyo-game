    <!-- The card this page becomes when someone posts the link. Discord,
         Slack, X, Reddit and every search result read these tags and
         nothing else: without them a shared link is a grey box with one
         word in it, which is the first thing most people ever see of the
         game. The URLs are absolute because a scraper has no page to
         resolve a relative one against; a self-hosted instance changes
         the origin on these four lines and nowhere else (docs/deploy.md).
         Nothing here is fetched by the browser, so the promise in
         PRIVACY.md that no third party sees a visitor still holds. -->
